version: '3.1'

services:
  points_service:
    build:
      context: ./points_service
      dockerfile: Dockerfile
    container_name: point_service_api
    environment:
      POSTGRES_USER: ms_points_app
      POSTGRES_PASSWORD: pwdpointsapp
      POSTGRES_DB: pointsDb
    ports:
      - 3002:3002
    depends_on:
      - pointsDb

  pointsDb:
    image: postgres:14.1
    container_name: pointsDb-dev
    ports:
      - 5434:5432
    volumes:
      - "./db/scripts/init_points_db.sql:/docker-entrypoint-initdb.d/init_points_db.sql"
      - ./points_service/points_database_vol:/var/lib/postgresql/data
    environment:
      POSTGRES_HOST: pointshost
      POSTGRES_USER: ms_points_app
      POSTGRES_PASSWORD: pwdpointsapp
      POSTGRES_DB: pointsDb
