version: '3.9'

x-kong-config: &kong-env
  KONG_DATABASE: ${KONG_DATABASE:-off}
  KONG_PG_DATABASE: ${KONG_PG_DATABASE:-kong}
  KONG_PG_HOST: db
  KONG_PG_USER: ${KONG_PG_USER:-kong}
  KONG_PG_PASSWORD_FILE: /run/secrets/kong_postgres_password

volumes:
  kong_data: {}
  kong_prefix_vol:
    driver_opts:
     type: tmpfs
     device: tmpfs
  kong_tmp_vol:
    driver_opts:
     type: tmpfs
     device: tmpfs
  auth_database_vol:

networks:
  kong-net:
    external: false
  rabbitmq_net:
    driver: bridge

services:
  kong-migrations:
    image: "${KONG_DOCKER_TAG:-kong:latest}"
    command: kong migrations bootstrap
    profiles: ["database"]
    depends_on:
      - db
    environment:
      <<: *kong-env
    secrets:
      - kong_postgres_password
    networks:
      - kong-net
    restart: on-failure

  kong-migrations-up:
    image: "${KONG_DOCKER_TAG:-kong:latest}"
    command: kong migrations up && kong migrations finish
    profiles: ["database"]
    depends_on:
      - db
    environment:
      <<: *kong-env
    secrets:
      - kong_postgres_password
    networks:
      - kong-net
    restart: on-failure

  kong:
    image: "${KONG_DOCKER_TAG:-kong:latest}"
    user: "${KONG_USER:-kong}"
    environment:
      <<: *kong-env
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: "${KONG_PROXY_LISTEN:-0.0.0.0:8000}"
      KONG_ADMIN_LISTEN: "${KONG_ADMIN_LISTEN:-0.0.0.0:8001}"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_PREFIX: ${KONG_PREFIX:-/var/run/kong}
      KONG_DECLARATIVE_CONFIG: "/opt/kong/kong.yaml"
    secrets:
      - kong_postgres_password
    networks:
      - kong-net
    ports:
      # The following two environment variables default to an insecure value (0.0.0.0)
      # according to the CIS Security test.
      - "${KONG_INBOUND_PROXY_LISTEN:-0.0.0.0}:8000:8000/tcp"
      - "${KONG_INBOUND_SSL_PROXY_LISTEN:-0.0.0.0}:8443:8443/tcp"
      # Making them mandatory but undefined, like so would be backwards-breaking:
      # - "${KONG_INBOUND_PROXY_LISTEN?Missing inbound proxy host}:8000:8000/tcp"
      # - "${KONG_INBOUND_SSL_PROXY_LISTEN?Missing inbound proxy ssl host}:8443:8443/tcp"
      # Alternative is deactivating check 5.13 in the security bench, if we consider Kong's own config to be enough security here

      - "127.0.0.1:8001:8001/tcp"
      - "127.0.0.1:8444:8444/tcp"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: on-failure:5
    read_only: true
    volumes:
      - kong_prefix_vol:${KONG_PREFIX:-/var/run/kong}
      - kong_tmp_vol:/tmp
      - ./config:/opt/kong
    security_opt:
      - no-new-privileges

  db:
    image: postgres:9.5
    profiles: ["database"]
    environment:
      POSTGRES_DB: ${KONG_PG_DATABASE:-kong}
      POSTGRES_USER: ${KONG_PG_USER:-kong}
      POSTGRES_PASSWORD_FILE: /run/secrets/kong_postgres_password
    secrets:
      - kong_postgres_password
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${KONG_PG_USER:-kong}"]
      interval: 30s
      timeout: 30s
      retries: 3
    restart: on-failure
    stdin_open: true
    tty: true
    networks:
      - kong-net
    volumes:
      - kong_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.8-management
    container_name: 'rabbitmq'
    ports:
        - 5672:5672
        - 15672:15672
    volumes:
        - ~/.docker-conf/rabbitmq/data/:/var/lib/rabbitmq/
        - ~/.docker-conf/rabbitmq/log/:/var/log/rabbitmq
    networks:
        - rabbitmq_net

  auth_service:
    build:
      context: ./auth_service/auth_service
      dockerfile: Dockerfile
    container_name: auth_service_api
    environment:
      POSTGRES_USER: ms_auth_app
      POSTGRES_PASSWORD: pwdauthsapp
      POSTGRES_DB: authDb
    ports:
      - 3000:3000
    volumes:
      - ./auth_service:/usr/src/auth_service
    networks:
      - kong-net
    depends_on:
      - authDb

  authDb:
    image: postgres:14.1
    container_name: authDb
    ports:
      - 5432:5432
    volumes:
      - "./auth_service/db/scripts/init_auth_db.sql:/docker-entrypoint-initdb.d/init_auth_db.sql"
      - ./auth_service/auth_database_vol:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ms_auth_app
      POSTGRES_PASSWORD: pwdauthsapp
      POSTGRES_DB: authDb
    networks:
      - kong-net

  user_service:
    build:
      context: ./user_service/user_service
      dockerfile: Dockerfile
    container_name: user_service_api
    environment:
      POSTGRES_USER: ms_user_app
      POSTGRES_PASSWORD: pwdauserapp
      POSTGRES_DB: userDb
    ports:
      - 3001:3001
    volumes:
      - ./user_service:/usr/src/user_service
    networks:
      - kong-net
    depends_on:
      - userDb

  userDb:
    image: postgres:14.1
    container_name: userDb
    ports:
      - 5433:5432
    volumes:
      - "./user_service/db/scripts/init_user_db.sql:/docker-entrypoint-initdb.d/init_user_db.sql"
      - ./user_service/user_database_vol:/var/lib/postgresql/data
    environment:
      POSTGRES_HOST: userhost
      POSTGRES_USER: ms_user_app
      POSTGRES_PASSWORD: pwduserapp
      POSTGRES_DB: userDb
    networks:
      - kong-net
  
  geo_service:
    build:
      context: ./geolocation_service/geolocation_service
      dockerfile: Dockerfile
    container_name: geolocation_api
    ports:
      - 3002:3002
    networks:
      - kong-net

  parking_service:
    build:
      context: ./parking_service/parking_service
      dockerfile: Dockerfile
    container_name: parking_service_api
    environment:
      POSTGRES_USER: ms_user_app
      POSTGRES_PASSWORD: pwdauserapp
      POSTGRES_DB: userDb
    ports:
      - 3003:3003
    volumes:
      - ./parking_service:/usr/src/parking_service
    networks:
      - kong-net
    depends_on:
      - parkingDb

  parkingDb:
    image: postgres:14.1
    container_name: parkingDb
    ports:
      - 5435:5432
    volumes:
      - "./parking_service/db/scripts/init_parking_db.sql:/docker-entrypoint-initdb.d/init_parking_db.sql"
      - ./parking_service/parking_database_vol:/var/lib/postgresql/data
    environment:
      POSTGRES_HOST: parkinghost
      POSTGRES_USER: ms_parking_app
      POSTGRES_PASSWORD: pwdparkingapp
      POSTGRES_DB: parkingDb
    networks:
      - kong-net
  
  notification_service:
    build:
      context: ./notification_service/notification_service
      dockerfile: Dockerfile
    container_name: notification_service
    ports:
      - 3004:3004
    networks:
      - kong-net

secrets:
  kong_postgres_password:
    file: ./POSTGRES_PASSWORD