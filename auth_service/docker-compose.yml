version: '3'

services:
  # loopback api service
  auth_service:
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    container_name: auth_service_api
    environment:
      MYSQL_USER: ms_auth_app
      MYSQL_PASSWORD: pwdauthapp
      MYSQL_DB: auth
    ports:
      - 3000:3000
    volumes:
      - ./auth_service:/usr/src/auth_service
    depends_on:
      - authDb

  # mysql database -> https://hub.docker.com/_/mysql/
  authDb:
    image: mysql:8.0.29
    container_name: auth-db
    volumes:
      - "./db/scripts/init_auth_db.sql:/docker-entrypoint-initdb.d/init_auth_db.sql"
      - "./.mysql-data/db:/var/lib/mysql"
    restart: always
    expose:
      - 3306
    ports:
        - 3306:3306
    environment:
      MYSQL_DATABASE: auth
      MYSQL_USER: ms_auth_app
      MYSQL_PASSWORD: pwdauthapp
      MYSQL_ROOT_PASSWORD: rootpw
