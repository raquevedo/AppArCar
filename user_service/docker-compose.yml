version: '3.1'

services:
  user_service:
    build:
      context: ./user_service
      dockerfile: Dockerfile
    container_name: user_service_api
    environment:
      POSTGRES_USER: ms_user_app
      POSTGRES_PASSWORD: pwdauserapp
      POSTGRES_DB: userDb
    ports:
      - 3001:3001
    depends_on:
      - userDb

  userDb:
    image: postgres:14.1
    container_name: userDb-dev
    ports:
      - 5433:5432
    volumes:
      - "./db/scripts/init_user_db.sql:/docker-entrypoint-initdb.d/init_user_db.sql"
      - ./user_service/user_database_vol:/var/lib/postgresql/data
    environment:
      POSTGRES_HOST: userhost
      POSTGRES_USER: ms_user_app
      POSTGRES_PASSWORD: pwduserapp
      POSTGRES_DB: userDb
