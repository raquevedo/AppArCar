version: '3.1'

services:
  parking_service:
    build:
      context: ./parking_service
      dockerfile: Dockerfile
    container_name: parking_service_api-dev
    environment:
      POSTGRES_USER: ms_user_app
      POSTGRES_PASSWORD: pwdauserapp
      POSTGRES_DB: userDb
    ports:
      - 3010:3010
    depends_on:
      - parkingDb

  parkingDb:
    image: postgres:14.1
    container_name: parkingDb-dev
    ports:
      - 5435:5432
    volumes:
      - "./db/scripts/init_parking_db.sql:/docker-entrypoint-initdb.d/init_parking_db.sql"
      - "./parking_database_vol:/var/lib/postgresql/data"
    environment:
      POSTGRES_HOST: parkinghost
      POSTGRES_USER: ms_parking_app
      POSTGRES_PASSWORD: pwdparkingapp
      POSTGRES_DB: parkingDb
