version: '3'

services:
  # loopback api service
  auth_service:
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    container_name: auth_service_api
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: authDb
    ports:
      - 3000:3000
    volumes:
      - ./auth_service:/usr/src/auth_service
    depends_on:
      - authDb

  authDb:
    image: postgres:14.1
    container_name: authDb
    ports:
      - 5432:5432
    volumes:
      - ./auth_database_vol:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: authDb

volumes:
  # mysql
  auth_database_vol: