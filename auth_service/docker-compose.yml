version: '3'

services:
  # loopback api service
  auth_service:
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    container_name: auth_service_api
    environment:
      MYSQL_USER: root
      MYSQL_PASSWORD: password
      MYSQL_DB: authDb
    ports:
      - 3000:3000
    volumes:
      - ./auth_service:/usr/src/auth_service
    depends_on:
      - authDb

  # mysql database -> https://hub.docker.com/_/mysql/
  authDb:
    image: mysql:5.6
    container_name: mysql-db
    ports:
        - 3306:3306
    environment:
      MYSQL_DATABASE: 'authDb'
      MYSQL_USER: 'loopback'
      MYSQL_PASSWORD: '12345'
      MYSQL_ROOT_HOST: '%'
      MYSQL_ROOT_PASSWORD: password
    # create and map separate volume
    volumes:
      - ./auth_database_vol:/var/lib/mysql

volumes:
  # mysql
  auth_database_vol:
