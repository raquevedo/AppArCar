_format_version: "2.1"
_transform: true

# Do NOT use IP addresses to configure Kong as those can change over time

services:
  - host: auth_service
    port: 3000
    name: auth_service
    protocol: http
    routes:
    - name: authentication
      paths:
      - /auth

  - host: user_service
    port: 3001
    name: user_service
    protocol: http
    routes:
    - name: user
      paths:
      - /user
  
  - host: geolocation_api
    port: 3002
    name: geolocation_api
    protocol: http
    routes:
    - name: geo
      paths:
      - /geo